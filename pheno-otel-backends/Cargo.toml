[package]
name = "pheno-otel-backends"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Extensible observability backend registry with stdout and OTLP backends"
rust-version = "1.75"

[dependencies]
pheno-otel = { path = "../pheno-otel" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "pheno_otel_backends"
path = "src/lib.rs"
