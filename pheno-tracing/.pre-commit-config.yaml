# pheno-vibecoding-guard pre-commit hook
# Same as pheno-agents-md, adopted here to catch drift on the single-binary
# observability crate (ci-critical). Generated by the V21 EXTENSION of
# FLEET_DAG_v3.md.
repos:
  - repo: local
    hooks:
      - id: pheno-vibecoding-guard
        name: pheno-vibecoding-guard (protects lockfiles, secrets, .gitmodules)
        entry: pheno-vibecoding-guard run --use-default --no-fail
        language: system
        pass_filenames: false
        stages: [pre-commit]
