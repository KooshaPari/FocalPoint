[package]
name = "focus-transpilers"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kooshapari/FocalPoint"

[dependencies]
focus-errors = { path = "../focus-errors" }
focus-result = { path = "../focus-result" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
