[package]
name = "pheno-errors"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minimal Error newtype + Result alias for the pheno-* fleet."
repository = "https://github.com/KooshaPari/phenotype"
keywords = ["error", "phenotype", "pheno-errors"]
